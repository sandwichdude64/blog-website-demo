<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background-color: #0b3d0b; /* dark green */
}

/* Header image */
.hero-img {
  width: 100%;
  height: 60vh;
  object-fit: cover;
  display: block;
}

/* Navigation */
.topnav {
  display: flex;
  flex-wrap: wrap;
  background-color: #8561a7;
}

.topnav a {
  flex: 1;
  min-width: 120px;
  color: black;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
}

.topnav a:hover {
  background-color: #7e5b9f;
}

.topnav a.active {
  background-color: #71538e;
}

/* Grace’s Lace style grid */
.post-grid {
  max-width: 1100px;
  margin: auto;
  padding: 40px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 40px;
}

/* SIDE-BY-SIDE CARD (IMAGE LEFT, TEXT RIGHT) */
.post-card {
  background: #ffffff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  cursor: pointer;
  display: flex;
  flex-direction: row; /* ← IMAGE LEFT */
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.post-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 24px rgba(0,0,0,0.25);
}

/* IMAGE COLUMN */
.post-card img {
  width: 300px;
  height: 100%;
  object-fit: cover;
}

/* TEXT COLUMN */
.post-content {
  flex: 1;
  padding: 20px;
}

/* Title */
.post-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 12px;
}

/* Description */
.post-desc {
  font-size: 16px;
  color: #333;
  line-height: 1.6;
}
</style>
</head>

<body>

<!-- Header image -->
<img src="butter.jpeg" class="hero-img">

<!-- Navigation -->
<div class="topnav">
  <a class="active" href="#dance">dance</a>
  <a href="#Archery">Archery</a>
  <a href="#placeholder">placeholder</a>
  <a href="#placeholder">placeholder</a>
  <a href="#placeholder">placeholder</a>
  <a href="#about">About</a>
</div>

<!-- Page content -->
<div style="padding-left:16px; color:white;">
  <h2>Newest Posts</h2>
  <p>Each post folder must contain a card.jpg and a PDF.</p>
</div>

<!-- Post list -->
<div id="post-list" class="post-grid"></div>

<!-- Auto-load posts -->
<script>
async function loadPosts() {
  try {
    const response = await fetch('posts.json');
    if (!response.ok) throw new Error("Could not find posts.json");

    const posts = await response.json();
    const list = document.getElementById("post-list");
    list.innerHTML = "";

    posts.forEach(post => {
      const card = document.createElement("div");
      card.className = "post-card";

      card.onclick = () => {
        window.open(`posts/${post.folder}/${post.pdf}`, "_blank");
      };

      card.innerHTML = `
        <img src="posts/${post.folder}/card.jpg" alt="${post.title}">
        <div class="post-content">
          <div class="post-title">${post.title}</div>
          <div class="post-desc">${post.desc}</div>
        </div>
      `;

      list.appendChild(card);
    });
  } catch (error) {
    console.error("Error loading posts:", error);
  }
}

loadPosts();
</script>

</body>
</html>
